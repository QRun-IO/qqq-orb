name: Build and Publish
env:
  REGISTRY: ghcr.io
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Build, test, and verify
      env:
        QQQ_MCP_VOYAGE_API_KEY: ${{ secrets.QQQ_MCP_VOYAGE_API_KEY }}
      run: mvn -B -ntp clean verify
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: target/qqq-mcp-rag-*.jar
        retention-days: 1
    - name: Preserve unit and integration test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: 'target/surefire-reports/

          target/failsafe-reports/'
        if-no-files-found: warn
        retention-days: 14
  publish:
    name: Publish Container
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: jar
        path: target/
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set image name
      run: printf 'IMAGE_NAME=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          '
'on':
  workflow_call:
    secrets:
      QQQ_MCP_VOYAGE_API_KEY:
        required: false
permissions:
  contents: read
