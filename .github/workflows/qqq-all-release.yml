name: qqq-all guarded release

on:
  workflow_call:
    inputs:
      version:
        description: Reviewed source version (GA or exact coordinated RC)
        required: true
        type: string
      release_sha:
        description: Full develop commit SHA already signed and tagged with the selected version
        required: true
        type: string
      smoke_evidence:
        description: github (legacy default) or circle (requires consumer adapter and Circle credential)
        type: string
        default: github
      circle_workflow_id:
        description: Exact successful Circle workflow UUID; verified independently through both APIs
        type: string
        default: ''
      smoke_run_id:
        description: Successful Smoke workflow run ID for that exact develop SHA
        default: ''
        required: false
        type: string
    secrets:
      CIRCLECI_TOKEN:
        required: false

permissions:
  checks: read
  actions: read
  contents: write
  packages: write

concurrency:
  group: qqq-all-release-4.1.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: qqq-all-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      SMOKE_EVIDENCE: ${{ inputs.smoke_evidence }}
      CIRCLE_WORKFLOW_ID: ${{ inputs.circle_workflow_id }}
      SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
      RELEASE_ENABLED: ${{ vars.QQQ_ALL_RELEASE_ENABLED }}
      LICENSE_CLEARED: ${{ vars.QQQ_ALL_RELEASE_LICENSE_APPROVED }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check manual release controls and exact tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/develop
          test "$RELEASE_ENABLED" = true
          test "$LICENSE_CLEARED" = true
          case "$VERSION" in 4.1.0|4.1.0-RC.1) ;; *) exit 1 ;; esac
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$SMOKE_EVIDENCE" in
            github) [[ "$SMOKE_RUN_ID" =~ ^[0-9]+$ ]] ;;
            circle)
              [[ "$CIRCLE_WORKFLOW_ID" =~ ^[0-9a-f-]{36}$ ]]
              ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(git rev-parse "refs/tags/$TAG")" > "$RUNNER_TEMP/tag-object.json"
      - name: Materialize reviewed central release gates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/central-release"
          cat > "$RUNNER_TEMP/central-release/qqq_all_release_gate.py" <<'PY'
          """Fail-closed checks for the manual 4.1.0 GA / exact RC.1 release workflow."""

          import argparse
          import hashlib
          import json
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path
          from xml.etree import ElementTree


          QBITS = (
              "quick-search", "user-role-permissions", "customizable-table-views",
              "standard-process-trace", "webhooks", "workflows", "geo-data",
              "sftp-data-integration",
          )
          RELEASE_VERSIONS = ("4.1.0", "4.1.0-RC.1")


          def immutable_version(value):
              return re.fullmatch(r"[0-9]+(?:\.[0-9]+){2,3}(?:-RC\.[1-9][0-9]*)?", value) is not None


          def validate_version(version):
              if version not in RELEASE_VERSIONS:
                  raise GateError("This release workflow is limited to 4.1.0 and 4.1.0-RC.1")


          class GateError(ValueError):
              pass


          def properties(path):
              root = ElementTree.parse(path).getroot()
              namespace = xml_namespace(root)
              values = root.find(f"{namespace}properties")
              if values is None:
                  raise GateError(f"Missing Maven properties in {path}")
              return {child.tag.removeprefix(namespace): (child.text or "").strip() for child in values}


          def xml_namespace(root):
              return root.tag.partition("}")[0] + "}" if root.tag.startswith("{") else ""


          def coordinates(path):
              root = ElementTree.parse(path).getroot()
              namespace = xml_namespace(root)
              parent = root.find(f"{namespace}parent")

              def value(name):
                  direct = root.findtext(f"{namespace}{name}")
                  inherited = parent.findtext(f"{namespace}{name}") if parent is not None else None
                  return direct or inherited

              return value("groupId"), value("artifactId"), value("version")


          def managed_dependencies(path):
              root = ElementTree.parse(path).getroot()
              namespace = xml_namespace(root)
              values = properties(path)
              if root.findall(f"{namespace}profiles/{namespace}profile/{namespace}dependencyManagement"):
                  raise GateError(f"Profile-managed dependency override in {path}")
              dependencies = root.find(f"{namespace}dependencyManagement/{namespace}dependencies")
              if dependencies is None:
                  raise GateError(f"Missing dependencyManagement in {path}")

              def field(dependency, name, default=""):
                  return (dependency.findtext(f"{namespace}{name}") or default).strip()

              managed = []
              for dependency in dependencies.findall(f"{namespace}dependency"):
                  version = field(dependency, "version")
                  reference = re.fullmatch(r"\$\{([^}]+)\}", version)
                  if reference:
                      version = values.get(reference.group(1), "")
                  if not immutable_version(version):
                      raise GateError(f"Unreleased managed dependency in {path}: "
                                      f"{field(dependency, 'artifactId')}")
                  managed.append((field(dependency, "groupId"), field(dependency, "artifactId"),
                                  version, field(dependency, "type", "jar"),
                                  field(dependency, "scope", "compile"),
                                  field(dependency, "classifier")))
              if not managed:
                  raise GateError(f"No managed dependencies in {path}")
              return managed


          def validate_managed_bom(path, version):
              managed = managed_dependencies(path)
              entries = {(group, artifact): (pin, kind, scope) for group, artifact, pin, kind, scope, _ in managed}
              if len(entries) != len(managed):
                  raise GateError(f"Duplicate managed dependency in {path}")
              if entries.get(("com.kingsrook.qqq", "qqq-bom-pom")) != (version, "pom", "import"):
                  raise GateError(f"QQQ BOM import differs from {version} in {path}")
              values = properties(path)
              if entries.get(("com.kingsrook.qqq", "qqq-frontend-next")) != (
                      values.get("qqq-frontend-next.version"), "jar", "compile"):
                  raise GateError(f"Managed Next differs from its release pin in {path}")
              for name in QBITS:
                  artifact = f"qbit-{name}"
                  if entries.get(("com.kingsrook.qbits", artifact)) != (
                          values.get(f"{artifact}.version"), "jar", "compile"):
                      raise GateError(f"Managed {artifact} differs from its release pin in {path}")
              return managed


          def validate_published_poms(parent_path, bom_path, version, local_bom):
              expected = (
                  (parent_path, "qqq-all-parent"),
                  (bom_path, "qqq-all-bom"),
              )
              for path, artifact in expected:
                  if coordinates(path) != ("com.kingsrook.qqq", artifact, version):
                      raise GateError(f"Published {artifact} POM is not the {version} release")
              published = properties(bom_path)
              if published.get("qqq.version") != version:
                  raise GateError(f"Published BOM does not import QQQ {version}")
              for name in QBITS:
                  key = f"qbit-{name}.version"
                  value = published.get(key, "")
                  if not immutable_version(value):
                      raise GateError(f"Published BOM {key} is not a release")
              local = properties(local_bom)
              for key in ("qqq.version", "qqq-frontend-next.version", *(f"qbit-{name}.version" for name in QBITS)):
                  if published.get(key) != local.get(key):
                      raise GateError(f"Published BOM {key} differs from release source")
              if validate_managed_bom(bom_path, version) != validate_managed_bom(local_bom, version):
                  raise GateError("Published BOM dependencyManagement differs from release source")


          def validate_poms(root, version):
              validate_version(version)
              parent = properties(root / "pom.xml")
              bom = properties(root / "qqq-all-bom/pom.xml")
              if parent.get("revision") != version or bom.get("qqq.version") != version:
                  raise GateError(f"Parent revision and QQQ BOM pin must both equal {version}")
              for name in QBITS:
                  key = f"qbit-{name}.version"
                  value = bom.get(key, "")
                  if not immutable_version(value):
                      raise GateError(f"{key} must be a published non-snapshot version")
              for key, value in bom.items():
                  if key.endswith(".version") and not immutable_version(value):
                      raise GateError(f"{key} must be an immutable release version")
              validate_managed_bom(root / "qqq-all-bom/pom.xml", version)


          def validate_smoke(run, jobs, sha):
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise GateError("Release SHA must be a full lowercase Git commit ID")
              expected = {
                  "name": "Smoke", "path": ".github/workflows/smoke.yml",
                  "head_sha": sha, "head_branch": "develop", "event": "push",
                  "conclusion": "success",
              }
              for key, value in expected.items():
                  if run.get(key) != value:
                      raise GateError(f"Smoke run {key} must equal {value}")
              observed = {"core": False, "full": False}
              for job in jobs.get("jobs", []):
                  name = job.get("name")
                  if name in observed:
                      if job.get("conclusion") != "success":
                          raise GateError(f"Smoke job {name} did not pass")
                      observed[name] = True
              if not all(observed.values()):
                  raise GateError("Smoke run must include successful core and full jobs")


          def validate_upstream_release(release, version):
              if (not immutable_version(version) or release.get("tag_name") != "v" + version
                      or release.get("draft") is not False
                      or release.get("prerelease") is not ("-RC." in version)):
                  raise GateError(f"Upstream release must be public v{version} with matching prerelease state")


          def validate_tag(tag, version, sha, tag_sha):
              validate_version(version)
              if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (sha, tag_sha)):
                  raise GateError("Tag and commit IDs must be full Git SHAs")
              if (tag.get("sha") != tag_sha or tag.get("tag") != version
                      or tag.get("object", {}).get("type") != "commit"
                      or tag.get("object", {}).get("sha") != sha
                      or tag.get("verification", {}).get("verified") is not True
                      or tag.get("verification", {}).get("reason") != "valid"):
                  raise GateError("Release tag must be signed, verified, annotated and point to the exact release commit")


          def download_public_inputs(bom, version, destination, central="https://repo.maven.apache.org/maven2"):
              """Fetch the declared first-party inputs and their parents without credentials."""
              validate_version(version)
              destination.mkdir(parents=True, exist_ok=True)
              receipts = []
              visited = set()

              def fetch(group, artifact, pin, kind):
                  coordinate = (group, artifact, pin, kind)
                  if coordinate in visited:
                      return
                  if (not re.fullmatch(r"[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)*", group)
                          or not re.fullmatch(r"[A-Za-z0-9_-]+", artifact) or not immutable_version(pin)):
                      raise GateError(f"Invalid or mutable public coordinate: {coordinate}")
                  visited.add(coordinate)
                  relative = f"{group.replace('.', '/')}/{artifact}/{pin}/{artifact}-{pin}.{kind}"
                  url = central + "/" + relative
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          data = response.read()
                  except (urllib.error.URLError, OSError) as error:
                      if isinstance(error, urllib.error.HTTPError):
                          error.close()
                      raise GateError(f"Public input unavailable: {relative}") from error
                  if not data:
                      raise GateError(f"Empty public input: {relative}")
                  path = destination / relative
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  if kind == "pom":
                      if coordinates(path) != (group, artifact, pin):
                          raise GateError(f"Public POM coordinates differ: {relative}")
                      root = ElementTree.fromstring(data)
                      ns = xml_namespace(root)
                      parent = root.find(f"{ns}parent")
                      if parent is not None:
                          parent_group = parent.findtext(f"{ns}groupId", "")
                          parent_pin = parent.findtext(f"{ns}version", "")
                          if not immutable_version(parent_pin):
                              raise GateError(f"Mutable parent in {relative}")
                          if parent_group.startswith("com.kingsrook"):
                              fetch(parent_group, parent.findtext(f"{ns}artifactId", ""), parent_pin, "pom")
                      if artifact == "qbit-build-parent":
                          imports = root.findall(f"{ns}dependencyManagement/{ns}dependencies/{ns}dependency")
                          props = root.find(f"{ns}properties")
                          values = {child.tag.removeprefix(ns): child.text for child in props} if props is not None else {}
                          qqq_imports = [dep for dep in imports if dep.findtext(f"{ns}groupId") == "com.kingsrook.qqq"
                                         and dep.findtext(f"{ns}artifactId") == "qqq-bom-pom"]
                          if len(qqq_imports) != 1:
                              raise GateError("Public qbit-build-parent must import the candidate QQQ BOM")
                          dep = qqq_imports[0]
                          actual = dep.findtext(f"{ns}version", "")
                          actual = values.get(actual[2:-1], "") if actual.startswith("${") else actual
                          if (actual != version or dep.findtext(f"{ns}type") != "pom"
                                  or dep.findtext(f"{ns}scope") != "import"):
                              raise GateError("Public qbit-build-parent QQQ import differs from the candidate")
                  receipts.append({"url": url, "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)})

              for group, artifact, pin, kind, _, classifier in validate_managed_bom(bom, version):
                  if group.startswith("com.kingsrook"):
                      if classifier or kind not in ("jar", "pom"):
                          raise GateError(f"Unsupported first-party release input: {artifact}")
                      fetch(group, artifact, pin, "pom")
                      if kind == "jar":
                          fetch(group, artifact, pin, "jar")
              (destination / "receipts.json").write_text(json.dumps(receipts, indent=2) + "\n")
              return receipts


          def validate_evidence(sha, smoke_run=None, smoke_jobs=None, circle_smoke=None):
              if circle_smoke is not None:
                  if smoke_run is not None or smoke_jobs is not None:
                      raise GateError("Select exactly one complete smoke evidence mode")
                  from verify_all_circle_smoke import validate, EvidenceError
                  try:
                      if (circle_smoke.get("schema") != "qqq-all-circle-smoke/v1"
                              or circle_smoke.get("repository") != "QRun-IO/qqq-all"
                              or circle_smoke.get("sha") != sha):
                          raise GateError("Circle evidence schema, repository or SHA differs")
                      validate(sha, circle_smoke["workflow_id"], circle_smoke["workflow"],
                               circle_smoke["pipeline"], circle_smoke["jobs"],
                               circle_smoke["check_runs"], circle_smoke["pipeline_workflows"])
                  except (EvidenceError, KeyError, TypeError) as error:
                      raise GateError("Circle smoke evidence rejected") from error
              else:
                  if smoke_run is None or smoke_jobs is None:
                      raise GateError("Select exactly one complete smoke evidence mode")
                  validate_smoke(smoke_run, smoke_jobs, sha)


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--root", type=Path, required=True)
              parser.add_argument("--version", required=True)
              parser.add_argument("--sha", required=True)
              parser.add_argument("--smoke-run", type=Path)
              parser.add_argument("--smoke-jobs", type=Path)
              parser.add_argument("--circle-smoke", type=Path)
              parser.add_argument("--published-parent", type=Path, required=True)
              parser.add_argument("--published-bom", type=Path, required=True)
              parser.add_argument("--upstream-release", type=Path, required=True)
              parser.add_argument("--next-release", type=Path, required=True)
              parser.add_argument("--tag-object", type=Path, required=True)
              parser.add_argument("--tag-sha", required=True)
              parser.add_argument("--public-inputs", type=Path, required=True)
              args = parser.parse_args()
              try:
                  validate_poms(args.root, args.version)
                  validate_upstream_release(json.loads(args.upstream_release.read_text()), args.version)
                  validate_upstream_release(json.loads(args.next_release.read_text()),
                                            properties(args.root / "qqq-all-bom/pom.xml")["qqq-frontend-next.version"])
                  validate_tag(json.loads(args.tag_object.read_text()), args.version, args.sha, args.tag_sha)
                  validate_evidence(args.sha,
                                    json.loads(args.smoke_run.read_text()) if args.smoke_run else None,
                                    json.loads(args.smoke_jobs.read_text()) if args.smoke_jobs else None,
                                    json.loads(args.circle_smoke.read_text()) if args.circle_smoke else None)
                  validate_published_poms(args.published_parent, args.published_bom, args.version,
                                          args.root / "qqq-all-bom/pom.xml")
                  download_public_inputs(args.root / "qqq-all-bom/pom.xml", args.version, args.public_inputs)
              except (GateError, OSError, ElementTree.ParseError, json.JSONDecodeError) as error:
                  print(f"Release gate failed: {error}", file=sys.stderr)
                  return 1
              print("Local POM and exact-commit smoke gates passed")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          cat > "$RUNNER_TEMP/central-release/verify_all_circle_smoke.py" <<'PY'
          #!/usr/bin/env python3
          """Fetch and verify exact-source qqq-all Circle smoke evidence; never synthesize GH runs."""
          import argparse
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import urllib.request
          from urllib.parse import urlparse

          REPO = 'QRun-IO/qqq-all'
          PROJECT = 'gh/' + REPO
          UUID = r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'


          class EvidenceError(ValueError):
              pass


          def require(value, message):
              if not value:
                  raise EvidenceError(message)


          def workflow_id(url):
              parsed = urlparse(url or '')
              require(parsed.scheme == 'https' and parsed.netloc == 'app.circleci.com', 'Untrusted Circle workflow URL')
              match = re.fullmatch('/workflow/(' + UUID + ')', parsed.path)
              require(match is not None, 'Unrecognized Circle workflow URL')
              return match.group(1)


          def validate(sha, selected, workflow, pipeline, jobs, checks, siblings):
              require(re.fullmatch(r'[0-9a-f]{40}', sha or ''), 'Expected full release SHA')
              require(re.fullmatch(UUID, selected or ''), 'Expected workflow UUID')
              require(workflow.get('id') == selected and workflow.get('project_slug') == PROJECT,
                      'Wrong workflow identity or project')
              require(workflow.get('name') == 'verify-and-smoke' and workflow.get('status') == 'success',
                      'Smoke workflow is not successful')
              # A rerun may execute selected jobs only. Do not infer inherited successes.
              require(not workflow.get('rerun_of') and workflow.get('auto_rerun_number', 0) == 0,
                      'Rerun ancestry is not supported')
              require(workflow.get('pipeline_id') == pipeline.get('id') and pipeline.get('project_slug') == PROJECT,
                      'Wrong pipeline identity or project')
              vcs = pipeline.get('vcs', {})
              require(vcs.get('revision') == sha and vcs.get('branch') == 'develop' and not vcs.get('tag'),
                      'Pipeline is not the exact develop source')
              require(vcs.get('origin_repository_url', '').removesuffix('.git') == 'https://github.com/' + REPO,
                      'Wrong source repository')
              trigger = pipeline.get('trigger', {})
              require(trigger.get('type') == 'webhook' and bool(trigger.get('received_at'))
                      and bool(trigger.get('actor', {}).get('login')), 'Unproven webhook trigger')
              candidates = [c for c in checks if c.get('name') == 'verify-and-smoke' and c.get('app', {}).get('id') == 18001]
              require(candidates, 'No Circle publisher check')
              latest = max(candidates, key=lambda c: c.get('id', 0))
              require(latest.get('head_sha') == sha and latest.get('status') == 'completed'
                      and latest.get('conclusion') == 'success', 'Latest Circle check did not pass this source')
              require(workflow_id(latest.get('details_url')) == selected, 'Selected workflow is not the latest trusted check')
              same = [w for w in siblings if w.get('name') == 'verify-and-smoke']
              require(len(same) == 1 and same[0].get('id') == selected,
                      'Multiple workflow attempts require explicit ancestry reconciliation')
              require(jobs and all(j.get('status') == 'success' and j.get('type') == 'build' for j in jobs),
                      'Workflow has missing, skipped, canceled, approval, or unsuccessful jobs')
              for name in ('build-and-test', 'core', 'full'):
                  matches = [j for j in jobs if j.get('name') == name]
                  require(len(matches) == 1 and matches[0].get('job_number') and matches[0].get('id'),
                          'Missing or duplicate required smoke job: ' + name)
              return {'schema': 'qqq-all-circle-smoke/v1', 'repository': REPO, 'sha': sha,
                      'branch': 'develop', 'workflow_id': selected, 'pipeline_id': pipeline['id'],
                      'check_run_id': latest['id'], 'workflow': workflow, 'pipeline': pipeline,
                      'jobs': jobs, 'check_runs': checks, 'pipeline_workflows': siblings}


          def gh(path):
              result = subprocess.run(['gh', 'api', '--method', 'GET', path], capture_output=True, timeout=60)
              require(result.returncode == 0, 'GitHub evidence read failed')
              return json.loads(result.stdout)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise EvidenceError('Circle API redirect refused')


          def circle(path):
              token = os.environ.get('CIRCLECI_TOKEN')
              require(token, 'CIRCLECI_TOKEN is required for Circle evidence mode')
              request = urllib.request.Request('https://circleci.com/api/v2/' + path,
                                               headers={'Circle-Token': token, 'Accept': 'application/json'})
              with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                  raw = response.read(2_000_001)
              require(len(raw) <= 2_000_000, 'Evidence response exceeds bound')
              return json.loads(raw)


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--sha', required=True)
              parser.add_argument('--workflow-id', required=True)
              parser.add_argument('--output', type=Path, required=True)
              args = parser.parse_args()
              require(re.fullmatch(UUID, args.workflow_id), 'Invalid workflow ID')
              require(re.fullmatch(r'[0-9a-f]{40}', args.sha), 'Invalid source SHA')
              workflow = circle('workflow/' + args.workflow_id)
              pipeline_id = workflow.get('pipeline_id', '')
              require(re.fullmatch(UUID, pipeline_id), 'Invalid pipeline ID')
              pipeline = circle('pipeline/' + pipeline_id)
              jobs = circle('workflow/' + args.workflow_id + '/job')
              siblings = circle('pipeline/' + pipeline_id + '/workflow')
              require(not jobs.get('next_page_token') and not siblings.get('next_page_token'),
                      'Paginated workflow evidence requires reconciliation')
              checks = gh('repos/' + REPO + '/commits/' + args.sha + '/check-runs?filter=all&per_page=100')
              require(checks.get('total_count', 0) <= 100, 'Too many check runs to establish latest attempt')
              evidence = validate(args.sha, args.workflow_id, workflow, pipeline, jobs['items'], checks['check_runs'], siblings['items'])
              args.output.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
              print('Exact-source Circle smoke evidence verified')


          if __name__ == '__main__':
              try:
                  main()
              except (EvidenceError, OSError, ValueError, KeyError, subprocess.TimeoutExpired):
                  sys.exit('Circle smoke evidence rejected or unavailable; no release authorization')
          PY
      - name: Verify Circle smoke provenance
        if: inputs.smoke_evidence == 'circle'
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        shell: bash
        run: python3 "$RUNNER_TEMP/central-release/verify_all_circle_smoke.py" --sha "$RELEASE_SHA" --workflow-id "$CIRCLE_WORKFLOW_ID" --output "$RUNNER_TEMP/circle-smoke.json"
      - name: Verify upstream release, signed tag, exact-commit smoke, public pins, and public GHCR
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/QRun-IO/qqq/releases/tags/v$VERSION" > "$RUNNER_TEMP/upstream-release.json"
          next_version="$(python3 -c 'import sys; import os; sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "central-release")); from qqq_all_release_gate import properties, validate_poms; from pathlib import Path; validate_poms(Path("."), os.environ["VERSION"]); print(properties(Path("qqq-all-bom/pom.xml"))["qqq-frontend-next.version"])')"
          gh api "repos/QRun-IO/qqq-frontend-next/releases/tags/v$next_version" > "$RUNNER_TEMP/next-release.json"
          smoke_args=()
          if [[ "$SMOKE_EVIDENCE" == github ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID" > "$RUNNER_TEMP/smoke-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/smoke-jobs.json"
            smoke_args=(--smoke-run "$RUNNER_TEMP/smoke-run.json" --smoke-jobs "$RUNNER_TEMP/smoke-jobs.json")
          else
            smoke_args=(--circle-smoke "$RUNNER_TEMP/circle-smoke.json")
          fi
          central="https://repo.maven.apache.org/maven2/com/kingsrook/qqq"
          for artifact in qqq-all-parent qqq-all-bom; do
            curl --fail --silent --show-error \
              "$central/$artifact/$VERSION/$artifact-$VERSION.pom" \
              --output "$RUNNER_TEMP/$artifact.pom"
          done
          python3 "$RUNNER_TEMP/central-release/qqq_all_release_gate.py" --root . --version "$VERSION" --sha "$RELEASE_SHA" \
            "${smoke_args[@]}" \
            --published-parent "$RUNNER_TEMP/qqq-all-parent.pom" \
            --published-bom "$RUNNER_TEMP/qqq-all-bom.pom" \
            --upstream-release "$RUNNER_TEMP/upstream-release.json" \
            --next-release "$RUNNER_TEMP/next-release.json" \
            --tag-object "$RUNNER_TEMP/tag-object.json" \
            --tag-sha "$(git rev-parse "refs/tags/$TAG")" \
            --public-inputs "$RUNNER_TEMP/public-inputs"
          test "$(gh api /orgs/QRun-IO/packages/container/qqq-all --jq .visibility)" = public
          gh api --paginate 'orgs/QRun-IO/packages/container/qqq-all/versions?per_page=100' \
            --jq '.[] | .metadata.container.tags[]?' > "$RUNNER_TEMP/ghcr-tags.txt"
          if grep -Fxq "$VERSION" "$RUNNER_TEMP/ghcr-tags.txt"; then
            echo "GHCR tag $VERSION already exists" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify release reactor
        shell: bash
        run: |
          set -euo pipefail
          printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>\n' > "$RUNNER_TEMP/public-settings.xml"
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          mvn -B -ntp -s "$RUNNER_TEMP/public-settings.xml" -gs "$RUNNER_TEMP/public-settings.xml" \
            -Dmaven.repo.local="$RUNNER_TEMP/release-m2" verify \
            org.apache.maven.plugins:maven-enforcer-plugin:3.5.0:enforce -Drules=requireReleaseDeps
      - name: Recheck develop, annotated tag, and release absence before publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/develop" --jq .commit.sha)" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$(git rev-parse "refs/tags/$TAG")"
          test "$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)" = "$RELEASE_SHA"
          if release_check="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)"; then
            echo "GitHub release $TAG already exists" >&2
            exit 1
          elif [[ "$release_check" != *"HTTP 404"* ]]; then
            echo "$release_check" >&2
            exit 1
          fi
          gh api --paginate 'orgs/QRun-IO/packages/container/qqq-all/versions?per_page=100' \
            --jq '.[] | .metadata.container.tags[]?' > "$RUNNER_TEMP/ghcr-tags-final.txt"
          if grep -Fxq "$VERSION" "$RUNNER_TEMP/ghcr-tags-final.txt"; then
            echo "GHCR tag $VERSION already exists" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/qrun-io/qqq-all:$VERSION"
          docker build \
            --label org.opencontainers.image.source=https://github.com/QRun-IO/qqq-all \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$image" .
          docker push "$image"
          printf 'Published image: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Build image Compose distribution bundle
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "ghcr.io/qrun-io/qqq-all:$VERSION")"
          python3 scripts/release_bundle.py --root . --version "$VERSION" --sha "$RELEASE_SHA" \
            --image "$image" --output "$RUNNER_TEMP"
      - name: Publish GitHub release with Compose bundle
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          case "$VERSION" in
            4.1.0) ;;
            4.1.0-RC.1) release_flags=(--prerelease --latest=false) ;;
            *) exit 1 ;;
          esac
          gh release create "$TAG" "$RUNNER_TEMP/qqq-all-$VERSION.tar.gz" \
            "$RUNNER_TEMP/qqq-all-$VERSION/compose.yaml" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "qqq-all $VERSION" --notes-from-tag "${release_flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/public-inputs/receipts.json
            ${{ runner.temp }}/tag-object.json
            ${{ runner.temp }}/upstream-release.json
            ${{ runner.temp }}/next-release.json
            ${{ runner.temp }}/circle-smoke.json
            ${{ runner.temp }}/smoke-run.json
            ${{ runner.temp }}/smoke-jobs.json
            ${{ runner.temp }}/qqq-all-${{ inputs.version }}/release.json
