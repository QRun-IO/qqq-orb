name: Database migrations
jobs:
  empty-database-migration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Empty PostgreSQL -> migrate -> validate, demo determinism, forward-only
        policy
      run: mvn -B -pl db verify
'on':
  workflow_call: {}
permissions:
  contents: read
