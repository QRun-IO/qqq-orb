name: authentik-schema-drift
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Resolve version and fetch its schema
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: "version=\"${INPUT_VERSION}\"\nif [ -z \"$version\" ]; then\n  version=$(gh release view --repo goauthentik/authentik\
        \ --json tagName -q .tagName | sed 's#^version/##')\nfi\necho \"Authentik $version\"\ncurl -fsSL \"https://raw.githubusercontent.com/goauthentik/authentik/version/${version}/schema.yml\"\
        \ -o \"$RUNNER_TEMP/schema.yml\"\necho \"SCHEMA=$RUNNER_TEMP/schema.yml\" >> \"$GITHUB_ENV\"\n"
    - name: Drift test
      run: ./mvnw -B -q test -Dtest=SchemaDriftTest -Dsurefire.failIfNoSpecifiedTests=false -Dauthentik.schema.file="$SCHEMA"
'on':
  workflow_call:
    inputs:
      version:
        description: Authentik version (e.g. 2026.10.0); empty = latest release
        required: false
        type: string
        default: ''
