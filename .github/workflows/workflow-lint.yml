name: Workflow lint
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    container: cimg/go:1.24
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/*.yml
