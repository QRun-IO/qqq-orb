name: Dashboard image

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/qrun-io/qqq-frontend-next

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/quickstart/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=dashboard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ matrix.arch }}
      - name: Verify runnable dashboard
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
        run: |
          container=$(docker run -d --rm -p 127.0.0.1:3000:3000 "$TAG")
          trap 'docker rm -f "$container"' EXIT
          curl -fsS --max-time 3 --retry 30 --retry-delay 1 --retry-all-errors \
            --retry-max-time 90 http://127.0.0.1:3000/app/person >/dev/null \
            || { docker logs "$container"; exit 1; }

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-architecture image
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${GITHUB_REF_NAME#v}" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
