name: CI

# Fast PR checks (QRun-IO/qqq#709, bundle budget #710). The real-backend gate, including the
# runtime performance budgets (specs/performance), runs in acceptance.yml.
# Each job installs on its own so they run in parallel; none needs a backend.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  unit:
    name: Typecheck, lint, unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests with src/lib coverage thresholds (vitest.config.ts)
        run: pnpm test:coverage

  e2e:
    name: Mocked e2e (Playwright, chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Production build
        run: pnpm build
      - name: Mocked e2e suite
        env:
          QQQ_E2E_SERVER: production
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  collaboration-e2e:
    name: Collaboration e2e (MSW; chromium, firefox, webkit, mobile, tablet)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
      - run: pnpm exec playwright install-deps chromium firefox webkit
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit
      - name: Collaboration suite (mock API, every browser project)
        run: pnpm exec playwright test --config playwright.collaboration.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: collaboration-e2e
          path: |
            test-results/collaboration/
            test-results/collab-shots/
          retention-days: 14

  storybook:
    name: Storybook build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet

  performance:
    name: Bundle budget (static export)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
      - name: Static export
        run: pnpm build:export
      - name: First-load JS per route, total JS and largest chunk against perf-budget.json
        run: pnpm perf:budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bundle-budget
          path: test-results/performance/bundle.json
          retention-days: 30
