version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  qqq-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Auto-publish filters.
develop-filters: &develop-filters
  branches:
    only: [develop]

main-filters: &main-filters
  branches:
    only: [main]

jobs:
  maven-publication-contract:
    resource_class: small
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Verify resolved multi-module publication POMs
          command: python3 tests/test_maven_publication_poms.py
      - run:
          name: Verify calculated versions match installed Maven coordinates
          command: python3 tests/test_effective_publication_version.py
  pipeline-contract-test:
    resource_class: small
    docker:
      - image: cimg/python:3.12-node
    steps:
      - checkout
      - run:
          name: Install the setup manifest parser
          command: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run:
          name: Verify pipeline selection and Maven compatibility contracts
          command: |
            python3 tests/test_generate_pipeline.py
            python3 scripts/pack_pipeline.py --check
            bash tests/test_cli_ci_behavior.sh
            python3 tests/test_cli_ci_contract.py
            python3 tests/test_maven_ci_contract.py
            python3 tests/test_standardize_qbit.py
            python3 tests/test_qbit_hotfix_profile.py
            python3 tests/test_qbit_feature_profile.py
            python3 tests/test_ci_maintenance.py
            python3 tests/test_rollout_version.py
            python3 tests/test_enforce_orb_checks.py
            python3 tests/test_static_analysis_exit.py
            python3 tests/test_validate_standard.py
            python3 tests/test_voyage_profile.py
            python3 tests/test_next_native.py
            python3 tests/test_auxiliary_workflows.py
            python3 tests/test_qbit_codeql.py
            python3 tests/test_repository_policy.py
            python3 tests/test_intellij_plugin.py
            python3 tests/test_workflow_lint.py
            python3 tests/test_business_e2e.py
            python3 tests/test_qctl_native.py
            python3 -m unittest discover -s tests -p test_generate_qctl_workflow.py
            python3 tests/test_rc_finalize_sweep.py
            python3 tests/test_rc_guard.py
            python3 -m unittest discover -s tests -p test_rc_timeout_recovery.py
            python3 -m unittest discover -s tests -p test_rc_ref_lookup.py
            python3 -m unittest discover -s tests -p test_generate_rc_workflow.py
            python3 -m unittest discover -s tests -p test_audit_estate.py
            python3 tests/test_all_profiles.py
            python3 tests/test_generate_all_release.py
            python3 -m unittest discover -s tests -p 'test_qqq_all_release*.py'
            python3 tests/test_verify_all_circle_smoke.py
            python3 tests/test_mobile_policy_profiles.py
            bash tests/test_all_artifact.sh
            python3 tests/test_maven_ci_rc_completion.py
            bash tests/test_maven_ci_push.sh
            bash tests/test_create_github_release.sh
            bash tests/test_maven_ci_cache.sh
            bash tests/test_maven_test_results.sh
            bash tests/test_maven_ci_install.sh
            bash tests/test_browser_install.sh
            bash tests/test_frontend_build_reuse.sh
            bash tests/test_snapshot_refresh.sh
            bash tests/test_maven_settings_output.sh
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/node:24.21
    steps:
      - checkout
      - run:
          name: Verify Maven settings stay out of build logs
          command: bash tests/test_maven_settings_output.sh
      - run:
          name: Verify npm publisher authentication and dist-tags
          command: python3 tests/test_node_npm_publish.py
      # Run your orb's commands to validate them.
      - qqq-orb/install_asciidoctor

  publish-dev-snapshot:
    docker:
      - image: circleci/circleci-cli:latest
    steps:
      - checkout
      - run:
          name: Pack and Publish Dev Snapshot
          command: |
            circleci orb pack src > /tmp/orb.yml
            circleci orb validate /tmp/orb.yml
            circleci orb publish --token "${CIRCLE_TOKEN}" /tmp/orb.yml kingsrook/qqq-orb@dev:snapshot
            echo "Published kingsrook/qqq-orb@dev:snapshot"

  publish-production:
    docker:
      - image: circleci/circleci-cli:latest
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Calculate Next Version and Publish
          command: |
            git fetch --tags
            LATEST=$(git tag -l 'v*' | sort -V | tail -1)
            LATEST=${LATEST:-v0.0.0}
            LATEST_CLEAN=${LATEST#v}

            # Check recent commit messages for bump keywords
            BUMP="patch"
            COMMITS=$(git log "${LATEST}..HEAD" --pretty=%s 2>/dev/null || git log --pretty=%s -10)
            if echo "${COMMITS}" | grep -qi '\[major\]'; then
              BUMP="major"
            elif echo "${COMMITS}" | grep -qi '\[minor\]'; then
              BUMP="minor"
            fi

            IFS='.' read -r MAJOR MINOR PATCH \<<< "${LATEST_CLEAN}"
            case "${BUMP}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            echo "Latest: ${LATEST} | Bump: ${BUMP} | Next: ${VERSION}"

            circleci orb pack src > /tmp/orb.yml
            circleci orb validate /tmp/orb.yml
            circleci orb publish --token "${CIRCLE_TOKEN}" /tmp/orb.yml "kingsrook/qqq-orb@${VERSION}"

            git config user.email "ci@qrun.io"
            git config user.name "CircleCI"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"

            echo "Published kingsrook/qqq-orb@${VERSION}"

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - pipeline-contract-test:
          filters: *filters
      - maven-publication-contract:
          filters: *filters
      # Auto-publish dev snapshot on develop
      - publish-dev-snapshot:
          context: orb-publishing
          filters: *develop-filters
          requires: [command-test, pipeline-contract-test, maven-publication-contract]
      # Auto-publish production release on main
      - publish-production:
          context: orb-publishing
          filters: *main-filters
          requires: [command-test, pipeline-contract-test, maven-publication-contract]
