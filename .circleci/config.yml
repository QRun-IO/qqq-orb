version: 2.1
setup: true
parameters:
  run_rc_finalize_sweep:
    type: boolean
    default: false
  run_enrollment_reconcile:
    type: boolean
    default: false
orbs:
  orb-tools: circleci/orb-tools@12.3
  shellcheck: circleci/shellcheck@3.2

filters: &filters
  tags:
    only: /.*/

jobs:
  enrollment-reconcile:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install reconciliation tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh
            python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run:
          name: Reconcile current QQQ branches
          no_output_timeout: 21m
          command: python3 tools/run_enrollment.py
      - store_artifacts:
          path: artifacts/enrollment
  rc-finalize-sweep:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Reconcile pending QBit releases
          command: |
            RC_REPOSITORIES_JSON="$(cat tools/rc-repositories.json)" \
              python3 src/scripts/rc_finalize_sweep.py

workflows:
  lint-pack:
    when:
      not:
        or:
          - << pipeline.parameters.run_rc_finalize_sweep >>
          - << pipeline.parameters.run_enrollment_reconcile >>
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: qqq-orb
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: qqq-orb
          requires: [orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
  reconcile-releases:
    when: << pipeline.parameters.run_rc_finalize_sweep >>
    jobs:
      - rc-finalize-sweep:
          context: qqq-maven-registry-credentials
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
  reconcile-enrollment:
    when: << pipeline.parameters.run_enrollment_reconcile >>
    jobs:
      - enrollment-reconcile:
          context: qqq-maven-registry-credentials
          filters:
            branches:
              only: main
            tags:
              ignore: /.*/
