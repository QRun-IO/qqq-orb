version: 2.1
jobs:
  central-status:
    docker:
    - image: cimg/python:3.12
    resource_class: small
    environment:
      QQQ_CENTRAL_DEPLOYMENT_ID: 5f9ac128-9d79-4fad-99d6-a53139337933
    steps:
    - checkout
    - run:
        name: Read existing Sonatype deployment state
        command: python3 tools/central_status.py
        no_output_timeout: 2m
workflows:
  diagnose-existing-deployment:
    jobs:
    - central-status:
        context:
        - qqq-maven-registry-credentials
        filters:
          branches:
            only: diagnostic/central-status
          tags:
            ignore: /.*/
