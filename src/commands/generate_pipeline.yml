description: Read a strict QQQ manifest and continue with its standardized pipeline.
parameters:
  orb_version:
    type: string
    description: Explicit orb version, identical to the setup import and manifest.
  manifest:
    type: string
    default: .qqq-ci.yml
    description: Repository manifest path.
  mongo_bind_diagnostics:
    type: boolean
    default: false
    description: Core owned Mongo fixture diagnostics.
  run_playwright:
    type: boolean
    default: false
    description: Material frontend Playwright validation before test or snapshot publication.
  next_acceptance_bundle_url:
    type: string
    default: ""
    description: Core Next acceptance bundle URL.
  next_acceptance_bundle_sha256:
    type: string
    default: ""
    description: Core Next acceptance bundle SHA256.
  next_acceptance_receipt_sha256:
    type: string
    default: ""
    description: Core Next acceptance receipt SHA256.
steps:
  - run:
      name: Install manifest parser
      command: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
  - validate_standard:
      orb_version: << parameters.orb_version >>
      manifest: << parameters.manifest >>
  - run:
      name: Generate and continue standardized pipeline
      shell: python3
      environment:
        QQQ_CI_MANIFEST: << parameters.manifest >>
        QQQ_CI_ORB_VERSION: << parameters.orb_version >>
        QQQ_CI_CONTINUE: "true"
        QQQ_CI_MONGO_DIAGNOSTICS: << parameters.mongo_bind_diagnostics >>
        QQQ_CI_RUN_PLAYWRIGHT: << parameters.run_playwright >>
        QQQ_CI_NEXT_ACCEPTANCE_BUNDLE_URL: << parameters.next_acceptance_bundle_url >>
        QQQ_CI_NEXT_ACCEPTANCE_BUNDLE_SHA256: << parameters.next_acceptance_bundle_sha256 >>
        QQQ_CI_NEXT_ACCEPTANCE_RECEIPT_SHA256: << parameters.next_acceptance_receipt_sha256 >>
      command: << include(scripts/packed_generate_pipeline.py) >>
