description: >
  Publishes artifacts to Maven Central (Sonatype Central Portal)
  - Configures Maven credentials without logging settings
  - Sets up GPG signing for artifact verification
  - Deploys signed artifacts and waits for confirmed Central release publication
  - Saves Maven cache for future builds

parameters:
  skip_verified_analysis:
    type: boolean
    default: false
    description: "Skip repeated SpotBugs and PMD only after this job has completed mvn_verify"

steps:
  - run:
      name: Setup Maven Settings
      command: <<include(scripts/setup_maven_settings.sh)>>
  - run:
      name: Setup GPG for signing
      command: <<include(scripts/mvn_jar_deploy_gpg_setup.sh)>>
  - run:
      name: Publish to Sonatype Central (releases and SNAPSHOTs)
      # Central's native publication wait can be silent for its 30-minute limit.
      # Let Maven return its real result before CircleCI's inactivity watchdog.
      no_output_timeout: 35m
      environment:
        QQQ_SKIP_VERIFIED_ANALYSIS: << parameters.skip_verified_analysis >>
      command: <<include(scripts/mvn_jar_deploy.sh)>>
  - save_cache:
      paths:
        - ~/.m2
      key: v1-dependencies-{{ checksum "pom.xml" }}
