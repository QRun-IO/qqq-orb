description: >
  Prepares Maven settings and restores the dependency repository.
  Browser installation and preliminary compilation retain their legacy defaults.
  The complete verification lifecycle saves the warmed repository.

parameters:
  install_browsers:
    type: boolean
    default: true
    description: "Install Chrome and ChromeDriver for browser tests"
  compile_before_verify:
    type: boolean
    default: true
    description: "Run preliminary compile; disable when a later lifecycle compiles the project"

steps:
  - run:
      name: Setup Maven Settings
      command: <<include(scripts/setup_maven_settings.sh)>>
  - mvn_cache_restore
  - when:
      condition: << parameters.install_browsers >>
      steps:
        - browser-tools/install-chrome
        - browser-tools/install-chromedriver
  - when:
      condition: << parameters.compile_before_verify >>
      steps:
        - run:
            name: Run Maven Compile
            command: <<include(scripts/mvn_build_compile.sh)>>
